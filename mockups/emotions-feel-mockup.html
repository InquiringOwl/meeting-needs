<script>
/* Relationships lens: course data (skill tree, feelings, needs, translator, examples).
   Built on Marshall B. Rosenberg's Nonviolent Communication. Feelings and needs lists
   are adapted from the Center for Nonviolent Communication's inventories (cnvc.org).
   Emotions: feel, need, soil (planned). Relationships: request, dialogue, then special situations. */
window.MN_REL = (function () {

  /* ---------- Needs (universal: no person, place, object or time inside) ---------- */
  var NEEDS = [
    { id: 'body', name: 'Body', blurb: 'What keeps a body alive and well', items: ['food', 'water', 'clean air', 'rest', 'sleep', 'movement', 'shelter', 'warmth', 'touch', 'health'] },
    { id: 'safety', name: 'Safety', blurb: 'Feeling secure enough to relax', items: ['safety', 'security', 'stability', 'predictability', 'protection', 'trust'] },
    { id: 'connection', name: 'Connection', blurb: 'Being with and known by others', items: ['connection', 'belonging', 'closeness', 'companionship', 'to be seen', 'to be heard', 'understanding', 'empathy', 'care', 'respect', 'acceptance', 'appreciation', 'support', 'consideration', 'cooperation', 'mutuality', 'fairness'] },
    { id: 'autonomy', name: 'Freedom', blurb: 'Choosing for yourself', items: ['freedom', 'choice', 'autonomy', 'independence', 'space', 'spontaneity'] },
    { id: 'honesty', name: 'Honesty', blurb: 'Being real with yourself and others', items: ['honesty', 'authenticity', 'integrity', 'presence', 'clarity'] },
    { id: 'peace', name: 'Peace', blurb: 'Ease in the body and the home', items: ['ease', 'order', 'calm', 'beauty', 'harmony', 'equality'] },
    { id: 'play', name: 'Play', blurb: 'Joy for its own sake', items: ['play', 'fun', 'humour', 'adventure', 'stimulation'] },
    { id: 'meaning', name: 'Meaning', blurb: 'A life that matters to you', items: ['purpose', 'contribution', 'competence', 'growth', 'learning', 'creativity', 'hope', 'celebration', 'mourning', 'inspiration'] }
  ];

  /* ---------- Feelings wheel (descriptions of inside, never of what someone did) ---------- */
  var WHEEL = {
    unmet: {
      label: 'When needs aren’t met',
      families: [
        { id: 'sad', name: 'Sad', hue: 222, words: ['sad', 'lonely', 'disappointed', 'discouraged', 'wistful'], needs: ['connection', 'belonging', 'to be seen', 'closeness', 'hope'] },
        { id: 'scared', name: 'Scared', hue: 268, words: ['scared', 'anxious', 'worried', 'nervous', 'wary'], needs: ['safety', 'predictability', 'trust', 'stability', 'support'] },
        { id: 'angry', name: 'Mad', hue: 8, words: ['angry', 'frustrated', 'irritated', 'resentful', 'furious'], needs: ['respect', 'fairness', 'choice', 'consideration', 'to be heard'] },
        { id: 'tense', name: 'Tense', hue: 32, words: ['tense', 'overwhelmed', 'stressed', 'restless', 'cranky'], needs: ['ease', 'order', 'space', 'rest', 'support'] },
        { id: 'tired', name: 'Tired', hue: 200, words: ['tired', 'exhausted', 'depleted', 'weary', 'burnt out'], needs: ['rest', 'sleep', 'food', 'support', 'ease'] },
        { id: 'confused', name: 'Confused', hue: 172, words: ['confused', 'torn', 'puzzled', 'lost', 'hesitant'], needs: ['clarity', 'understanding', 'learning', 'purpose', 'choice'] },
        { id: 'hurt', name: 'Hurt', hue: 330, words: ['hurt', 'grieving', 'heartbroken', 'aching', 'regretful'], needs: ['care', 'mourning', 'to be seen', 'trust', 'empathy'] },
        { id: 'numb', name: 'Disconnected', hue: 240, words: ['numb', 'withdrawn', 'bored', 'distant', 'detached'], needs: ['connection', 'stimulation', 'purpose', 'play', 'presence'] },
        { id: 'embarrassed', name: 'Embarrassed', hue: 350, words: ['embarrassed', 'ashamed', 'self-conscious', 'flustered', 'guilty'], needs: ['acceptance', 'belonging', 'integrity', 'respect', 'growth'] }
      ]
    },
    met: {
      label: 'When needs are met',
      families: [
        { id: 'joyful', name: 'Joyful', hue: 45, words: ['happy', 'delighted', 'glad', 'amused', 'elated'], needs: ['play', 'fun', 'celebration', 'connection'] },
        { id: 'peaceful', name: 'Peaceful', hue: 160, words: ['calm', 'relaxed', 'content', 'centred', 'relieved'], needs: ['ease', 'calm', 'safety', 'rest'] },
        { id: 'grateful', name: 'Grateful', hue: 95, words: ['grateful', 'moved', 'touched', 'appreciative', 'thankful'], needs: ['appreciation', 'care', 'support', 'contribution'] },
        { id: 'engaged', name: 'Engaged', hue: 190, words: ['curious', 'absorbed', 'interested', 'fascinated', 'alert'], needs: ['learning', 'stimulation', 'growth', 'creativity'] },
        { id: 'affectionate', name: 'Affectionate', hue: 335, words: ['warm', 'tender', 'loving', 'friendly', 'open-hearted'], needs: ['closeness', 'touch', 'belonging', 'companionship'] },
        { id: 'hopeful', name: 'Hopeful', hue: 60, words: ['hopeful', 'encouraged', 'optimistic', 'eager', 'expectant'], needs: ['hope', 'purpose', 'growth', 'inspiration'] },
        { id: 'refreshed', name: 'Refreshed', hue: 125, words: ['rested', 'refreshed', 'renewed', 'energised', 'alive'], needs: ['rest', 'sleep', 'movement', 'clean air'] },
        { id: 'confident', name: 'Confident', hue: 210, words: ['confident', 'safe', 'empowered', 'proud', 'secure'], needs: ['competence', 'security', 'autonomy', 'trust'] }
      ]
    }
  };

  /* ---------- Accusation words: a "you did this to me" hiding inside ---------- */
  var FAUX = [
    { word: 'abandoned', hidden: 'You left me.', feelings: ['lonely', 'scared', 'sad'], needs: ['connection', 'belonging', 'support', 'safety'] },
    { word: 'violated', hidden: 'You crossed my line.', feelings: ['scared', 'angry', 'tense'], needs: ['safety', 'respect', 'choice', 'trust'] },
    { word: 'ignored', hidden: 'You didn’t pay attention to me.', feelings: ['lonely', 'hurt', 'frustrated'], needs: ['to be seen', 'to be heard', 'consideration', 'connection'] },
    { word: 'dismissed', hidden: 'You brushed me off.', feelings: ['hurt', 'frustrated', 'discouraged'], needs: ['to be heard', 'respect', 'understanding'] },
    { word: 'attacked', hidden: 'You came at me.', feelings: ['scared', 'angry', 'tense'], needs: ['safety', 'respect', 'calm'] },
    { word: 'humiliated', hidden: 'You shamed me.', feelings: ['embarrassed', 'hurt', 'angry'], needs: ['respect', 'acceptance', 'belonging'] },
    { word: 'betrayed', hidden: 'You broke my trust.', feelings: ['hurt', 'angry', 'heartbroken'], needs: ['trust', 'honesty', 'safety'] },
    { word: 'manipulated', hidden: 'You tricked me into it.', feelings: ['angry', 'wary', 'confused'], needs: ['choice', 'honesty', 'autonomy', 'trust'] },
    { word: 'rejected', hidden: 'You pushed me away.', feelings: ['hurt', 'sad', 'lonely'], needs: ['acceptance', 'belonging', 'closeness'] },
    { word: 'unappreciated', hidden: 'You don’t value what I do.', feelings: ['discouraged', 'tired', 'resentful'], needs: ['appreciation', 'to be seen', 'mutuality'] },
    { word: 'misunderstood', hidden: 'You got me wrong.', feelings: ['frustrated', 'lonely', 'discouraged'], needs: ['understanding', 'to be heard', 'clarity'] },
    { word: 'pressured', hidden: 'You’re pushing me.', feelings: ['tense', 'anxious', 'resentful'], needs: ['choice', 'autonomy', 'ease', 'space'] },
    { word: 'used', hidden: 'You took without giving.', feelings: ['angry', 'resentful', 'hurt'], needs: ['mutuality', 'fairness', 'respect'] },
    { word: 'neglected', hidden: 'You didn’t take care of me.', feelings: ['lonely', 'sad', 'hurt'], needs: ['care', 'support', 'connection'] },
    { word: 'interrupted', hidden: 'You cut me off.', feelings: ['frustrated', 'irritated'], needs: ['to be heard', 'respect', 'consideration'] },
    { word: 'criticised', hidden: 'You judged me.', feelings: ['hurt', 'anxious', 'embarrassed'], needs: ['acceptance', 'respect', 'support'] }
  ];

  /* ---------- Need or strategy? ---------- */
  var SORT = [
    { text: 'I need my husband to do the dishes.', kind: 'strategy', why: 'It names a person and an action. Underneath: support, rest, mutuality.', needs: ['support', 'rest', 'mutuality'] },
    { text: 'I need rest.', kind: 'need', why: 'No person, place, thing or time. Anyone anywhere needs rest.' },
    { text: 'I need to quit my job.', kind: 'strategy', why: 'One action among many. Underneath: maybe meaning, rest, respect, autonomy, and security too.', needs: ['purpose', 'rest', 'respect', 'autonomy', 'security'] },
    { text: 'I need belonging.', kind: 'need', why: 'Universal. There are a hundred ways to meet it.' },
    { text: 'I need you to text me when you’re running late.', kind: 'strategy', why: 'A specific person and action. Underneath: predictability, reassurance, consideration.', needs: ['predictability', 'trust', 'consideration'] },
    { text: 'I need freedom to choose my own tasks.', kind: 'need', why: 'Freedom and choice are needs. “On my own timeline” keeps it open: it doesn’t name who or when.' },
    { text: 'I need the kids to stop yelling.', kind: 'strategy', why: 'Underneath: calm, ease, maybe rest. The kids have needs too (play!), so look for a strategy that meets both.', needs: ['calm', 'ease', 'rest'] },
    { text: 'I need a bigger apartment.', kind: 'strategy', why: 'An object. Underneath: space, order, ease. Some of those can be met where you are.', needs: ['space', 'order', 'ease'] },
    { text: 'I need to be understood.', kind: 'need', why: 'Understanding is universal.' },
    { text: 'I need my sister to understand me.', kind: 'strategy', why: 'Same need, but now it depends on one person. If she can’t right now, the need can still be met elsewhere.', needs: ['understanding'] },
    { text: 'I need safety.', kind: 'need', why: 'The most basic one.' },
    { text: 'I need clean air.', kind: 'need', why: 'A body need. Opening a window, a fan or a filter are the strategies.' }
  ];

  /* ---------- Identify a need: where is the feeling coming from? ---------- */
  var SOURCES = [
    { id: 'body', label: 'My body', hint: 'hungry, thirsty, tired, in pain, too hot or cold, stuck indoors', needs: ['food', 'water', 'rest', 'sleep', 'movement', 'warmth', 'health', 'clean air'],
      note: 'Mad because you’re hungry is a different signal from mad because something was taken. Meet the body need first; the rest often softens.' },
    { id: 'someone', label: 'Something someone did or said', hint: 'a word, a look, a broken plan', needs: ['respect', 'consideration', 'to be heard', 'to be seen', 'trust', 'understanding'] },
    { id: 'mine', label: 'Something I care about was taken, broken or threatened', hint: 'my things, my space, my time, my plans', needs: ['security', 'safety', 'trust', 'respect', 'fairness', 'order', 'choice'],
      note: 'Underneath “that’s mine” is usually security, trust or respect: needs the other person has too.' },
    { id: 'situation', label: 'Too much at once', hint: 'noise, mess, deadlines, no time to myself', needs: ['ease', 'order', 'space', 'calm', 'predictability', 'support'] },
    { id: 'unsure', label: 'Not sure', hint: 'that’s fine; the feeling will point the way', needs: [] }
  ];

  /* ---------- Worked example for Communicate (two people) ---------- */
  var CONFLICT = {
    a: { name: 'Me', obs: 'the dishes are still in the sink at bedtime', feelings: ['tired', 'discouraged'], needs: ['support', 'rest'], request: 'wash them before bed tonight' },
    b: { name: 'Sam', feelings: ['tense', 'resentful'], needs: ['choice', 'autonomy'], context: 'freedom to choose my tasks on my own timeline', request: 'let me do them in the morning' },
    both: [
      'Each of us picks which evening jobs are ours, once a week.',
      'Dishes are done by 10am the next day, by whoever is free.',
      'Wash together after dinner with music on, ten minutes, kids drying.',
      'Soak the pans overnight, so the morning job is small.'
    ],
    thanks: ['relieved', 'grateful']
  };

  /* ---------- Two courses (Emotions, then Relationships), one page per unit; sub-units are sections on that page.
     course: which lens the unit lives in. planned: shown dashed, with a short description, until it's written. ---------- */
  var UNITS = [
    { id: 'feel', course: 'emotions', num: 1, word: 'Feel', sub: 'what’s alive inside of you', intro: 'Feelings are messages about needs. Learn to read them without blame, and to name them precisely.',
      subs: [
        { id: 'signals', title: 'Emotions are messengers', short: 'Every feeling points to a need, met or not.',
          key: ['Feelings aren’t good or bad. Each one is information.',
            'Your feelings are telling you something. Pleasant emotions say a need is met (“thank you”); painful ones say a need is unmet (“please meet our need”).',
            'Someone or something can *trigger* a feeling, but the emotion reflects your personal need. This keeps the power in our hands, and by self-regulating, a responsibility to choose differently to meet those needs.',
            'You may believe you have no choice (e.g. to pay rent, or be unhoused, or something else — and I hear you, let’s face our crummy options through upcoming units!). You may not like your choices, but it’s vital to remember your responsibility for your choices.'],
          ex: [['I feel cranky at 5pm every day.', 'Maybe food, maybe rest. Bodies send feelings too.'], ['I feel delighted watching the kids wash carrots.', 'A need is met: contribution, togetherness, play.']],
          remember: 'The feeling is the messenger; the need is the message.' },
        { id: 'accusations', title: 'Accusatory feelings', short: 'Focusing on just you in a vacuum, rather than implying another’s actions.',
          key: ['Some words sound like feelings but tell a story about someone else: *abandoned* means “you left me.”',
            'They point the finger outward, so the other person defends instead of listening, and you lose sight of your own need.',
            'The pain is real. Translate it to the feeling and need underneath.'],
          tool: 'translator', remember: 'A hidden “you did it”? Translate to feeling + need.' },
        { id: 'pain', title: 'Physical pain can signal emotions',
          short: 'Is it tissue damage, or a neuroplastic condition? Either way, it’s real pain, but not all bodily pains (especially chronic issues) indicate structural damage. Your brain may be trying to protect you, using the body’s pain language. (Read Dr. Howard Schubiner’s “Unlearn Your Pain” for more while I build out this unit.)',
          key: ['**Start with body needs.** Angry because you’re hungry? Snappy because you’re tired, cold or hurting? That irritability is valid: it’s pointing at food, rest, warmth or care, and meeting that need first often softens the rest.',
            '**Needs come and go.** You’ll be hungry again tomorrow. We can’t fix any need forever, and nothing lasts forever, us included. We tend each one as it comes.',
            '**The brain decides when to send pain.** Pain is the brain’s danger signal. Usually it protects injured tissue, but the brain can learn to keep sending pain after tissue heals, especially through stress, fear or hard emotions. That’s neuroplastic pain: just as real, and it can be unlearned.',
            '**Clues it may be neuroplastic:** it began in a stressful time or without a clear injury; it moves around or shows up in several places; it flares with stress, certain people or places, and fades when you’re absorbed in something; scans and tests don’t explain it. See a clinician first to rule out structural causes.',
            '**Fear turns the volume up.** Bracing against pain tells the brain there’s danger, which makes more pain. Safety, curiosity and kindness toward your body turn it down, and so can writing out what you feel (anger, grief, fear).',
            '**It’s all part of the puzzle.** Body needs, emotions and learned pain are all information about what’s going on inside of us, and how to make the world hurt less.'],
          remember: 'Real pain, many sources. Tend the body, the feeling and the fear.',
          src: 'Adapted from Howard Schubiner with Michael Betzold, <em>Unlearn Your Pain</em> (Mind Body Publishing). This is Kinship’s own short summary; see a clinician to rule out structural causes.',
          opinion: 'Following the moon’s phases alongside your own cycle, especially for women, can be a gentle way to notice patterns in your energy, moods and body’s needs.',
          opinionSrc: 'Source: Helfrich-Förster et al., “Women temporarily synchronize their menstrual cycles with the luminance and gravimetric cycles of the Moon,” <em>Science Advances</em> 7 (2021). The evidence is still mixed, so treat it as something to notice, not a rule.' },
        { id: 'wheel', title: 'Feelings wheel', short: 'Spin to the feeling that fits, and see the universal needs it may be pointing to.', isTool: true,
          tool: 'wheel', remember: 'Name the feeling, then follow it to the need.',
          next: ['need', 'universal', 'Next unit · 2.1', 'Universal needs', 'The roots beneath every feeling: needs every person shares.'] }
      ] },
    { id: 'need', course: 'emotions', num: 2, word: 'Identify the need', sub: 'the roots beneath', intro: 'Underneath every feeling is a universal need. Find it, and you have more than one way to meet it.',
      subs: [
        { id: 'universal', title: 'Universal needs', short: 'Food, safety, rest, freedom, belonging…',
          key: ['Every person shares the same needs: food, water, clean air, rest, safety, belonging, freedom, meaning, play.',
            'A need never names a person, place, object or time. That’s what makes it universal.',
            'Because we share them, we can recognise each other’s needs, even mid-conflict.'],
          tool: 'needs', remember: 'No who, where, what or when inside a need.' },
        { id: 'strategies', title: 'Needs vs. strategies', short: '“I need you to…” is a strategy. Find the need under it.',
          key: ['A strategy is one way to meet a need: a specific person, action, thing or time.',
            'One need has many strategies. Conflict happens when we cling to just one.',
            'Ask: *if I got this, what would it give me?* Keep asking until it’s universal.'],
          tool: 'sorter', remember: 'Conflicts live between strategies. Needs never conflict.' },
        { id: 'identify', title: 'Identify a need', short: 'The inner tool: from a big feeling to the need underneath.', isTool: true,
          key: ['Start broad (sad, mad, scared) and narrow to the word that fits. “Mad” might be *frustrated* (needs ease), *resentful* (needs fairness) or *irritated* (needs rest).',
            'Ask where it’s coming from: your body, something someone did, something of yours, or too much at once.',
            'Land on the need, and let it matter before you solve anything.'],
          tool: 'finder', remember: 'Feeling → source → need.' },
        { id: 'beneath', title: 'Yes, and: beneath the noun', short: 'A job or money is a strategy. Yes, it matters, and beneath it sit needs like safety, choice and care for the people you love.', planned: true }
      ] },
    { id: 'soil', course: 'emotions', num: 3, word: 'Who you are', sub: 'what’s going on down there', planned: true,
      intro: 'The soil beneath the roots: the you who chooses, the body that remembers, and the tools your mind brings.',
      subs: [
        { id: 'chooser', title: 'The one who chooses', short: 'Present awareness makes choices, never as blame: “I have to go to work” becomes “I choose to, because I want a home and food.”', planned: true },
        { id: 'remembers', title: 'The body that remembers', short: 'The feeling body carries memories and beliefs, and tries to protect you from pain it has known.', planned: true },
        { id: 'mindbody', title: 'Mind & body', short: 'How mind and body talk: memories, protection, and signals the brain learns to send.', planned: true },
        { id: 'tools', title: 'Your mind’s tools', short: 'Imagination, memory, planning and mental math.', planned: true }
      ] },
    { id: 'request', course: 'relationships', num: 1, word: 'Request', sub: 'ask, don’t demand', intro: 'Once you know your need, say it out loud: kindly, clearly, and in a way the other person can say yes or no to.',
      subs: [
        { id: 'sharing', title: 'Sharing feelings and needs', short: 'What happened, how you feel, and what you need.',
          key: ['Start with what a camera would record: “The dishes have been in the sink since Tuesday,” not “you never help.” Swap *always* and *never* for what actually happened.',
            'Then your feeling and the need under it: “I feel tense, because I need order.”',
            'Own it: someone can trigger a feeling, but it comes from your need. That keeps the other person listening instead of defending.'],
          ex: [['“You’re always on your phone.”', '→ “You checked your phone three times during dinner. I felt lonely, because I need connection.”']],
          remember: 'Observation, feeling, need. Then ask.' },
        { id: 'requests', title: 'Not demands', short: 'Ask for something doable, and be ready to hear “no”.',
          key: ['A demand carries blame or punishment if refused. A request doesn’t.',
            'The test: how will I respond to a “no”? A “no” is a yes to another need. Get curious about which.',
            'Make it positive, specific and doable now: “Would you be willing to… tonight?”'],
          ex: [['“Stop leaving your stuff everywhere.”', '→ “When I see bags on the table, I feel tense, because I need order. Would you be willing to clear it before dinner?”']],
          remember: 'Ask for what you want, not what you don’t.' },
        { id: 'anticipating', title: 'Anticipating needs', short: 'Meet them the way you’d want to be met.',
          key: ['We share the same needs, so you can often guess theirs before they say a word: rest after a long shift, quiet before a big day, a snack before a hard talk.',
            'Look for strategies that meet everyone’s needs from the start, so nobody has to give anything up.',
            'Arrive with kindness and curiosity, not a case to argue. Your needs stay on the table too.'],
          remember: 'Same needs, so the same kindness.' }
      ] },
    { id: 'dialogue', course: 'relationships', num: 2, word: 'Dialogue', sub: 'meet both needs', intro: 'Listen as well as speak. Keep both sets of needs on the table until you find a strategy that meets them, then say thank you.',
      subs: [
        { id: 'ask', title: 'Ask if your strategy meets their needs', short: 'Check for a real yes, not a resentful one.',
          key: ['After you suggest a strategy, ask: “Would that work for you too?” Then listen for the need behind the answer.',
            'Guess their feeling and need out loud: “Are you feeling ___ because you need ___?” A guess, not a diagnosis. No fixing or advising yet.',

      ] }
  ];

  /* ---------- Special applications (later: a second vertical tree beneath the first) ---------- */
  /* Special situations, in page order (the three animal groups first). Each opens as an accordion on #lens-relationships/special. */
  var APPS = [
    { id: 'family', name: 'Family animals', short: 'Companions who share our homes, routines and moods, and their emotional needs.', status: 'Soon', preview: true },
    { id: 'wild', name: 'Wild animals', short: 'Neighbors who live by their own rules: room, closed offers, urban wildlife and land left livable.', status: 'Soon', preview: true },

    { id: 'children', name: 'Children', short: 'Togetherness instead of split labor; kids pitching in beside you.', status: 'Soon' },

    { id: 'plants', name: 'Plants', short: 'A plant’s signals as needs; continues in Gardening.', status: 'Soon' },
    { id: 'groups', name: 'Gatherings & events', short: 'Hosting, rounds and agreements, conflict in a circle.', status: 'Soon' },
    { id: 'projects', name: 'Projects', short: 'A shared goal, roles by willingness, check-ins.', status: 'Later' },
    { id: 'power', name: 'Power & peace', short: 'Nonviolence, abolition, and power with instead of power over.', status: 'Later', preview: true }
  ];

  return { NEEDS: NEEDS, WHEEL: WHEEL, FAUX: FAUX, SORT: SORT, SOURCES: SOURCES, CONFLICT: CONFLICT, UNITS: UNITS, APPS: APPS };
})();

</script>
<script>
/* Tier 1 Signals: two courses from one file, Emotions (inside) then Relationships (between).
   Overviews, one page per unit (sub-units are sections), special situations, and the tools
   (feelings wheel, needs, accusation translator, need-or-strategy, Identify a need, Communicate).
   Routes: #lens-emotions[/<unit>[/<sub>]]   (unit: feel | need | soil)
           #lens-relationships[/<unit>[/<sub>]]   (unit: request | dialogue | special[/<id>])
   A unit opened under the other course's address (old links like #lens-relationships/feel) is shown in its own course
   and the address is corrected. The sidebar shows both courses. Registers window.MN_LENS_VIEWS.emotions and .relationships;
   app.js supplies header/footer/esc/toast/deeper via window.MN. */
(function () {
  'use strict';
  var D = window.MN_REL;
  var BASES = { emotions: '#lens-emotions', relationships: '#lens-relationships' };
  var NAMES = { emotions: 'Emotions', relationships: 'Relationships' };
  var BASE = BASES.relationships;
  var KEY = 'meeting-needs.rel.v3';
  var ALIAS = { 'feel/narrow': 'need/identify', 'request/observe': 'request/sharing', 'request/kindness': 'request/anticipating', 'dialogue/listening': 'dialogue/ask', 'dialogue/generous': 'dialogue/ask', 'dialogue/gratitude': 'dialogue/narrowing', animals: 'special/captive', 'special/animals': 'special/captive', finder: 'need/identify', identify: 'need/identify', dialogue: 'dialogue/communicate', conflict: 'dialogue/communicate', communicate: 'dialogue/communicate' };

  var UNIT = {}, FAMILY_OF = {}, FAUX = {}, SOURCE = {};
  /* k: the colour key for each unit (rel.css). SEQ: every unit in reading order, across both courses. */
  var KEYS = { feel: 'feel', need: 'need', soil: 'soil', request: 'request', dialogue: 'dialogue' };
  var COURSE_UNITS = { emotions: [], relationships: [] }, SEQ = D.UNITS.slice();
  D.UNITS.forEach(function (u) { UNIT[u.id] = u; u.k = KEYS[u.id] || u.id; COURSE_UNITS[u.course].push(u); });
  ['unmet', 'met'].forEach(function (m) {
    D.WHEEL[m].families.forEach(function (f) { f.mode = m; f.words.forEach(function (w) { FAMILY_OF[w] = f; }); });
  });
  D.FAUX.forEach(function (x) { FAUX[x.word] = x; });
  D.SOURCES.forEach(function (s) { SOURCE[s.id] = s; });

  var FEEL_PICK = ['tired', 'discouraged', 'frustrated', 'sad', 'lonely', 'anxious', 'overwhelmed', 'tense', 'hurt', 'resentful'];
  var NEED_PICK = ['support', 'rest', 'connection', 'order', 'ease', 'respect', 'fairness', 'mutuality', 'to be heard', 'safety', 'choice', 'autonomy', 'space', 'appreciation', 'play'];
  var THANKS_PICK = ['relieved', 'grateful', 'hopeful', 'calm', 'touched', 'warm'];

  /* ---------- state ---------- */
  var prog = (function () { try { var r = JSON.parse(localStorage.getItem(KEY) || '{}'); return r && typeof r === 'object' ? r : {}; } catch (e) { return {}; } })();
  if (!prog.learned || typeof prog.learned !== 'object') prog.learned = {};
  function saveProgress() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) { /* storage blocked */ } }

  var S = {
    wheel: { solo: { mode: 'unmet', fam: null, word: null, rot: 0 }, finder: { mode: 'unmet', fam: null, word: null, rot: 0 } },
    needs: [], sort: {}, faux: 'abandoned',
    finder: blankFinder(),
    cf: cloneConflict()
  };
  function blankFinder() { return { fam: null, faux: null, feelings: [], source: null, needs: [], showAll: false }; }
  function cloneConflict() {
    var c = D.CONFLICT;
    return { a: JSON.parse(JSON.stringify(c.a)), b: JSON.parse(JSON.stringify(c.b)), both: c.both.slice(), pick: 0, add: '', thanks: c.thanks.slice() };
  }

  /* ---------- helpers ---------- */
  function mn() { return window.MN; }
  function esc(s) { return mn().esc(s); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>'); }
  function list(arr) { if (!arr.length) return ''; if (arr.length === 1) return arr[0]; return arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1]; }
  function uniq(arr) { var s = {}; return arr.filter(function (x) { if (s[x]) return false; s[x] = 1; return true; }); }
  function toggle(arr, v) { var i = arr.indexOf(v); if (i === -1) arr.push(v); else arr.splice(i, 1); }
  function attrs(o) { var s = ''; Object.keys(o || {}).forEach(function (k) { s += ' ' + k + '="' + esc(o[k]) + '"'; }); return s; }
  function chip(action, value, label, on, cls, extra) {
    return '<button type="button" class="rel-chip' + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" data-rel="' + action + '" data-v="' + esc(value) + '"' + attrs(extra) + ' aria-pressed="' + !!on + '">' + esc(label) + '</button>';
  }
  function href(u, sub) { return (UNIT[u] ? BASES[UNIT[u].course] : BASE) + '/' + u + (sub ? '/' + sub : ''); }
  function learned(id) { return !!prog.learned[id]; }

  /* ---------- sidebar: both Signals courses, inside then outside ----------
     The current course is open; the other is collapsed to its unit names, so the flow from inner to outer stays visible. */
  function vtUnit(u, cur) {
    var on = cur === u.id;
    return '<li class="rel-vt-unit k-' + u.k + ' u-' + u.id + (on ? ' cur' : '') + (learned(u.id) ? ' done' : '') + (u.planned ? ' planned' : '') + '">' +
      '<a class="rel-vt-head" href="' + href(u.id) + '"' + (on ? ' aria-current="page"' : '') + '>' +
      '<span class="rel-vt-dot" aria-hidden="true">' + (learned(u.id) ? '✓' : u.num) + '</span>' +
      '<span><b>' + esc(u.word) + '</b><small>' + esc(u.sub) + (u.planned ? ' · planned' : '') + '</small></span></a>' +
      '<ol class="rel-vt-subs">' + u.subs.map(function (s) {
        return '<li><a href="' + href(u.id, s.id) + '" data-spy="' + u.id + '-' + s.id + '"' + (s.isTool ? ' class="tool"' : '') + '>' + esc(s.title) +
          (s.isTool ? ' <span class="rel-tooltag">tool</span>' : '') + (s.planned && !u.planned ? ' <span class="rel-soon">planned</span>' : '') + '</a></li>';
      }).join('') + '</ol></li>';
  }
  function sidebar(cur, course) {
    var wide = window.matchMedia && window.matchMedia('(min-width: 900px)').matches;
    function block(c, label, extra) {
      var open = c === course;
      return '<div class="rel-course' + (open ? '' : ' collapsed') + '"><a class="rel-course-head" href="' + BASES[c] + '"' + (open && !cur ? ' aria-current="page"' : '') + '><b>' + NAMES[c] + '</b><span class="eyebrow">' + label + '</span></a>' +
        '<ol class="rel-vt">' + COURSE_UNITS[c].map(function (u) { return vtUnit(u, cur); }).join('') + (extra || '') + '</ol></div>';
    }
    var special = '<li class="rel-vt-unit k-apps u-special' + (cur === 'special' ? ' cur' : '') + '"><a class="rel-vt-head" href="' + BASE + '/special"' + (cur === 'special' ? ' aria-current="page"' : '') + '>' +
      '<span class="rel-vt-dot" aria-hidden="true">3</span><span><b>Special situations</b><small>the people, animals and places in your life</small></span></a>' +
      '<ol class="rel-vt-subs">' + D.APPS.map(function (a) { return '<li><a href="' + spHref(a.id) + '">' + esc(a.name) + '</a></li>'; }).join('') + '</ol></li>';
    return '<nav class="rel-nav" aria-label="Signals courses: Emotions and Relationships">' +
      '<details class="rel-nav-wrap"' + (wide ? ' open' : '') + '><summary class="rel-nav-head"><span class="eyebrow">Tier 1 · Signals</span><b>Inside, then outside</b></summary>' +
      block('emotions', 'Inside') +
      '<p class="rel-bridge" aria-hidden="true">then, connect</p>' +
      block('relationships', 'Between', special) +
      '</details></nav>';
  }
  function layout(cur, main, course) {
    return mn().header('home') + '<div class="rel-layout">' + sidebar(cur, course) + '<main class="rel-main">' +
      '<div class="rel-topbar"><button type="button" class="rel-back" data-rel="back">← Back</button></div>' + main + '</main></div>' + mn().footer();
  }

  /* ---------- overview pieces ---------- */
  function card(u) {
    return '<div class="rel-tu k-' + u.k + (learned(u.id) ? ' done' : '') + (u.planned ? ' planned' : '') + '">' +
      '<span class="rel-tu-n" aria-hidden="true">' + (learned(u.id) ? '✓' : u.num) + '</span><div>' +
      '<a class="rel-tu-head" href="' + href(u.id) + '"><b>' + esc(u.word) + '</b><small>' + esc(u.sub) + '</small>' + (u.planned ? ' <span class="rel-soon">planned</span>' : '') + '</a>' +
      '<ol>' + u.subs.filter(function (s) { return !s.isTool; }).map(function (s) {
        return '<li><a href="' + href(u.id, s.id) + '"' + (s.planned ? ' class="planned"' : '') + '>' + esc(s.title) + (s.planned ? '<span class="sr-only"> (planned)</span>' : '') + '</a></li>';
      }).join('') + '</ol></div></div>';
  }
  function tool(u, sub, eyebrow, name, text) {
    return '<a class="rel-tt k-' + u + '" href="' + href(u, sub) + '"><span class="eyebrow">' + eyebrow + '</span><b>' + name + '</b><span>' + text + '</span><i>Open →</i></a>';
  }
  var SPROUT = '<svg class="rel-sprout" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 33V15" stroke="#4E8A3E" stroke-width="2.2" stroke-linecap="round"/><path d="M17 19c-1-6-6-9-12-8 1 6 6 9 12 8z" fill="#8CC07A" stroke="#4E8A3E" stroke-width="1.6"/><path d="M17 15c1-7 6-11 13-10-1 7-6 11-13 10z" fill="#A9D396" stroke="#4E8A3E" stroke-width="1.6"/></svg>';
  function coursePager(prevH, prevL, nextH, nextL) {
    return '<nav class="rel-pager" aria-label="Courses">' +
      (prevH ? '<a class="rel-pg prev" href="' + prevH + '"><small>← Previous course</small><b>' + prevL + '</b></a>' : '<a class="rel-pg prev" href="#"><small>← Back to</small><b>Education</b></a>') +
      (nextH ? '<a class="rel-pg next" href="' + nextH + '"><small>Next course →</small><b>' + nextL + '</b></a>' : '<a class="rel-pg next" href="#lens-water"><small>Next →</small><b>Tier 2 · Water</b></a>') + '</nav>';
  }
  /* Go deeper credits live in app.js (SHOULDERS) so the Resources page and every course share one list. */

  /* ---------- Emotions overview: plants, roots, soil ----------
     Going down is going deeper, so the units read 1 → 3 top to bottom: feelings are what’s alive inside you (the plants),
     needs are the roots, and the soil is who you are underneath. */
  function viewEmotions() {
    var U = COURSE_UNITS.emotions;
    return {
      title: 'Emotions · Kinship',
      html: layout(null,
        '<section class="rel-hero"><span class="eyebrow">Tier 1 · Signals · Course 1 of 2</span><h1 tabindex="-1">Emotions</h1>' +
        '<p class="lede">Your rich inner world. Feelings are what’s alive inside of you: anger, love and pain are all asking to be tended. Beneath them are the roots, what you need, and beneath those the soil: who you are, and what’s going on down there.</p></section>' +
        '<section class="rel-depth" aria-label="Course map: plants, roots and soil">' +
          '<div class="rel-plants">' + SPROUT + '<div class="rel-plants-in"><p class="rel-layer"><b>Plants · what shows</b><span>Anger, love, pain: signals asking to be tended. Others can see them too.</span></p>' + card(U[0]) + tool('feel', 'wheel', 'Inner tool', 'Feelings wheel', 'Spin to the feeling that fits, and see the needs it may point to.') + '</div></div>' +
          '<div class="rel-ground"><div class="rel-gauge" aria-hidden="true"><span>Deeper</span></div>' +
            '<p class="rel-layer"><b>Roots · what you need</b><span>Universal, beneath every strategy.</span></p>' + card(U[1]) +
            tool('need', 'identify', 'Inner tool', 'Identify a need', 'From a big feeling to the word that fits and the need underneath.') +
            '<p class="rel-layer"><b>Soil · who you are</b><span>What’s going on down there.</span></p>' + card(U[2]) +
          '</div></section>' +
        mn().deeper('People whose work shaped this course, and where to go for more.', mn().credits('emotions')) +
        coursePager(null, null, BASES.relationships, 'Relationships'), 'emotions')
    };
  }

  /* ---------- Relationships overview: between gardens, then special situations ---------- */
  function viewRelationships() {
    var U = COURSE_UNITS.relationships;
    var apps = D.APPS.map(function (a) {
      return '<li class="is-open"><a href="' + spHref(a.id) + '"><b>' + esc(a.name) + '</b><span>' + esc(a.short) + '</span><small>In progress · open →</small></a></li>';
    }).join('');
    return {
      title: 'Relationships · Kinship',
      html: layout(null,
        '<section class="rel-hero"><span class="eyebrow">Tier 1 · Signals · Course 2 of 2</span><h1 tabindex="-1">Relationships</h1>' +
        '<p class="lede">Connecting inner worlds. Every conflict is two people trying to meet their universal needs through strategies that aren’t working yet. Once you can hear your own needs, say them kindly and keep everyone’s on the table.</p></section>' +
        '<a class="rel-rooted" href="' + BASES.emotions + '">' + SPROUT + '<span><b>Rooted in Emotions</b><span>Feel and Identify the need come first: what’s showing in you, and what you need.</span></span><i>← Course 1</i></a>' +
        '<section class="rel-out" aria-label="Course map">' +
          '<p class="rel-zone"><b>Between gardens</b><span>Others see your plants, and you see theirs.</span></p>' +
          card(U[0]) + card(U[1]) +
          tool('dialogue', 'communicate', 'Between people', 'Communicate', 'Hear each other’s needs and find a strategy that meets you both.') +
        '</section>' +
        '<section class="rel-apps" aria-labelledby="rel-apps-h"><div class="rel-apps-head"><span class="rel-tu-n">3</span><div><h2 id="rel-apps-h"><a href="' + BASE + '/special">Special situations</a></h2><p>Your inner world and theirs, applied to the particular people, animals and places in your life.</p></div></div>' +
        '<ul>' + apps + '</ul></section>' +
        mn().deeper('People whose work shaped this course, and where to go for more.', mn().credits('relationships')) +
        coursePager(BASES.emotions, 'Emotions', null, null), 'relationships')
    };
  }

  /* ---------- unit page: every sub-unit on one page (planned ones as short dashed sections) ---------- */
  function viewUnit(u, subId) {
    var i = SEQ.indexOf(u), prev = SEQ[i - 1], next = SEQ[i + 1], total = COURSE_UNITS[u.course].length;
    var secs = u.subs.map(function (s, j) {
      var h = '<section class="rel-sec' + (s.isTool ? ' is-tool' : '') + (s.planned ? ' is-planned' : '') + '" id="sec-' + u.id + '-' + s.id + '" data-sec="' + u.id + '-' + s.id + '">' +
        '<div class="rel-sec-head"><span class="rel-sec-n">' + u.num + '.' + (j + 1) + '</span><div><h2>' + esc(s.title) + (s.isTool ? ' <span class="rel-tooltag">tool</span>' : '') + (s.planned ? ' <span class="rel-soon">planned</span>' : '') + '</h2><p>' + esc(s.short) + '</p></div></div>';
      if (s.key) h += '<ul class="rel-keys">' + s.key.map(function (k) { return '<li>' + md(k) + '</li>'; }).join('') + '</ul>';
      if (s.ex) h += '<div class="rel-ex">' + s.ex.map(function (e) { return '<div><p class="rel-say">' + md(e[0]) + '</p><p>' + md(e[1]) + '</p></div>'; }).join('') + '</div>';
      if (s.tool) h += '<div class="rel-tool" data-tool="' + s.tool + '">' + TOOLS[s.tool]() + '</div>';
      if (s.next) h += '<a class="rel-nextunit k-' + KEYS[s.next[0]] + '" href="' + href(s.next[0], s.next[1]) + '"><span class="eyebrow">' + esc(s.next[2]) + '</span><b>' + esc(s.next[3]) + '</b><span>' + esc(s.next[4]) + '</span><i aria-hidden="true">→</i></a>';
      if (s.remember) h += '<p class="rel-remember"><span class="eyebrow">Remember</span>' + md(s.remember) + '</p>';

      return h + '</section>';
    }).join('');
    function pg(x, dir) {
      if (!x) return dir === 'prev'
        ? '<a class="rel-pg prev" href="' + BASES[u.course] + '"><small>← Back to</small><b>' + NAMES[u.course] + '</b></a>'
        : '<a class="rel-pg next" href="' + BASE + '/special"><small>Next →</small><b>Special situations</b></a>';
      var label = (x.course !== u.course ? NAMES[x.course] + ' · ' : '') + x.num + ' · ' + esc(x.word);
      return '<a class="rel-pg ' + dir + ' k-' + x.k + '" href="' + href(x.id) + '"><small>' + (dir === 'prev' ? '← Previous' : 'Next →') + '</small><b>' + label + '</b></a>';
    }
    var html = '<article class="rel-unitpage k-' + u.k + '">' +
      '<header class="rel-unit-hero"><span class="eyebrow">' + NAMES[u.course] + ' · Unit ' + u.num + ' of ' + total + (u.planned ? ' · planned' : '') + '</span><h1 tabindex="-1">' + esc(u.word) + '</h1><p class="rel-unit-sub">' + esc(u.sub) + '</p><p class="lede">' + esc(u.intro) + '</p>' +
      '<ol class="rel-jumps">' + u.subs.map(function (s, j) { return '<li><a href="' + href(u.id, s.id) + '"><span>' + u.num + '.' + (j + 1) + '</span>' + esc(s.title) + '</a></li>'; }).join('') + '</ol></header>' +

  }

  /* ---------- special situations: one page, one accordion each (Animals first) ----------
     Routes: #lens-relationships/special[/<id>]. The older preview routes (#…/animals, /neighbors, /power, /coops, /pets, /wild)

  function spHref(id) { return BASE + '/special/' + id; }
  function tryIt(t) { return '<p class="rel-remember"><span class="eyebrow">Try it</span>' + md(t) + '</p>'; }

  function animalsAfter() {
    var items = [
      ['Food', 'every recipe in the course comes from plants: the cheapest, longest-keeping and most shareable way to meet the need for food.', '#lens-food', 'Food'],
      ['Food', 'what each companion species eats in nature, kibble and raw food told plainly, and complete plant-based food as one option.', '#lens-food/companions', 'Food → Companions'],
      ['Water', 'where California’s farm water goes, including the feed grown for farmed animals.', '#lens-water/sources/take', 'Water → Sources'],
      ['Poisons', 'wool, leather, down and silk kept in use secondhand, instead of new.', '#lens-toxins/exposures/healthy', 'Poisons → What healthy looks like'],
      ['Poisons', 'poison-free ways to share a home with ants, mice and other wild neighbors.', '#lens-toxins/pesticides/yard', 'Poisons → Yard, home and companions']
    ];
    return '<section class="rel-sec" id="sec-captive-3"><div class="rel-sec-head"><span class="rel-sec-n">A.3</span><div><h2>Across Kinship</h2><p>Where peace with animals shows up in the other lenses.</p></div></div>' +
      '<ul class="rel-keys">' + items.map(function (x) { return '<li><strong>' + x[0] + ':</strong> ' + esc(x[1]) + ' <a href="' + x[2] + '">' + esc(x[3]) + '</a></li>'; }).join('') + '</ul></section>' +
      (mn().opinion ? mn().opinion('<p>Modern commodification of animal bodies as products is something I never trust enough to recommend, especially new.</p>') : '');
  }
  function specials() {
    return {
      captive: {
      id: 'captive', letter: 'A', name: 'Captive animals', sub: 'Animals humans keep for use, and someone, not something',
      lede: 'Animals share our homes, our neighborhoods, our water and our food systems. They have feelings and needs, and they tell us about them with their bodies. The same four steps (notice, feel, find the need, ask) work here, starting with how we talk about them.',
      secs: [
        ['Someone, not something', 'Respect starts in language.', [
          '**Pronouns:** use **they/them** for an animal when you don’t know their sex, and **he** or **she** when you do, the same way you would for a person. “It” turns someone into something.',
          '**Who, not that:** “the cat who lives next door”, “the cow who…”.',
          '**Call animals by who they are:** a cow, a pig, a chicken, a fish. Words like “beef”, “pork”, “poultry” and “seafood” are names for what animals become after they die. Language that hides the animal makes the harm easier to look past.',
          '**Farmed animals,** not “livestock” or “stock”, which count living beings as inventory.'
        ]],
        ['Cows, in their own right', 'More than the water their lives use.', [
          'The Water course counts how much water goes into one cow raised for meat (about 99% of it grows their feed). That matters, and it isn’t the main reason a cow matters. She matters because she’s someone.',
          '**Cows have friends.** Studies find cows are calmer and less stressed when they’re with a preferred companion.',
          '**Mothers and calves bond.** In dairy farming, calves are usually separated from their mothers within hours to a day of birth so the milk can be sold.',
          '**Cows feel and learn.** Young cows have shown excitement when they solve a problem themselves. Cows can live 15–20 years; those raised for meat in US feedlots are usually killed at about 18–22 months.',
          'Scientists agree that mammals and birds have the brain systems for conscious experience, and evidence for fish keeps growing. Pigs, chickens and fish feel fear and pain too.'
        ], '<p class="rel-q">Water lens: <a href="#lens-water/sources/take">how much water goes into animal foods</a></p>' +
          src('Sources: McLennan, <i>Social bonds in dairy cattle</i> (University of Northampton, 2013); Hagen &amp; Broom, “Emotional reactions to learning in cattle,” <i>Applied Animal Behaviour Science</i> (2004); <i>Cambridge Declaration on Consciousness</i> (2012); <i>New York Declaration on Animal Consciousness</i> (2024).')]
      ],
      intro: '<p class="rel-sp-lead">When Kinship says meeting everyone’s needs, everyone includes animals. They’re sentient, they feel, and they share the same universal needs we do: food, water, safety, rest, play, company and choice. So every strategy gets the same question: does it meet the animals’ needs too?</p>',
      after: animalsAfter(),
      note: 'Family animals and Wild animals each have their own section. The full Captive animals unit (farms, labs, shows and sanctuaries) is in progress.',
      related: ['#lens-water/sources/take', 'Water: farm water']

      family: {
        id: 'family', letter: 'F', name: 'Family animals', sub: 'Companions who share our homes, routines and moods',
        lede: 'Cats, dogs, rabbits, birds and the rest of a household’s animals are family. They share our rooms and routines, they pick up on our moods, and they have emotional lives of their own. The same four steps work with them: notice their signals, wonder what they’re feeling, find the need, and change what you offer.',
        secs: [
          ['Reading their signals', 'Behavior is communication.', [
            'Ears, tail, posture, appetite, hiding, pacing and play are all signals. “Bad dog” becomes “what is he needing?”',
            'Shared needs: food, water, safety, rest, play, company and choice. Each species has its own strategies: cats need high places and hunting games, dogs need to sniff, rabbits need another rabbit.',
            '**Choice and consent:** let animals approach you, and notice when they move away. A “no” from an animal counts too.'
          ]],
          ['Their emotional needs', 'Safety, play, company and a say.', [
            '**Predictability:** regular meals, walks and quiet times help animals feel safe. Moves, new people and loud days ask a lot of them.',
            '**Play** is a need, not a luxury: chasing a toy meets a cat’s need to hunt, sniffing a new street meets a dog’s need to explore.',
            '**Company of their own kind:** rabbits, guinea pigs, rats and many birds are lonely alone. Many cats like company on their own terms.',
            '**Places to retreat:** a box, a high shelf, a crate left open, a room where nobody follows.',
            'Hiding, over-grooming, not eating, or peeing outside the litter box are often stress or pain. A vet first, then a look at what changed at home.'
          ]],
          ['Feelings across species', 'They read us, and we can read them.', [
            'Dogs match human faces with voices by emotion, and cats recognize their own people’s voices. Stress and calm in a home reach the animals in it.',
            'Being with a companion animal can be a real comfort, and they’re not a tool for it: their needs count on the hard days too.',
            '**Grief is real.** Losing an animal family member is a loss like any other. Children need room to grieve them too, with honest, simple words.',
            'People facing eviction or homelessness often keep their animals close at great cost. Pet-friendly shelters and pet food banks keep families together, animals included.'
          ], src('Sources: Albuquerque et al., “Dogs recognize dog and human emotions,” <i>Biology Letters</i> (2016); Saito &amp; Shinozuka, “Vocal recognition of owners by domestic cats,” <i>Animal Cognition</i> (2013).') +
            '<p class="rel-q">Food lens: <a href="#lens-food/companions">what each animal eats</a> · <a href="#lens-food/gentle/animals">tender times</a> · Poisons: <a href="#lens-toxins/exposures/companions">what their bodies can’t process</a></p>' +
            tryIt('Watch one animal at home for five minutes. What need is each thing they do trying to meet?')]
        ],
        note: 'The full Family animals unit (species by species, introductions, and end-of-life care) is in progress.',
        related: [spHref('animals'), 'Animals']

      wild: {
        id: 'wild', letter: 'W', name: 'Wild animals', sub: 'Neighbors who live by their own rules',
        lede: 'Crows, raccoons, coyotes, bees, mice and the birds on the wire live alongside us without being ours. Kinship with wild animals mostly means giving them room, closing the accidental offers our homes make, and leaving the land a little more livable for them.',
        secs: [
          ['Wild neighbors', '“Pests” are neighbors with needs.', [
            'Mice, ants, raccoons and pigeons come because a home is meeting their needs: food, water, warmth, shelter. Change what the home offers and they move on.',
            'Seal food, fix drips and close gaps: when a home stops offering food, water and shelter, its visitors move on.',
            'Poisons travel: rat poison kills owls, hawks, foxes and cats who eat a poisoned animal. California has restricted the strongest rodenticides since 2021 for this reason.'
          ], src('Source: California AB 1788 (2020), restrictions on second-generation anticoagulant rodenticides.')],
          ['Watching, not handling', 'Room is the kindest gift.', [
            'Wild animals do best when they stay wary of people. Feeding raccoons, ducks or coyotes draws them close to roads, dogs and conflict.',
            'Bird feeders and baths are lovely when they’re cleaned often; dirty ones spread disease between birds.',
            '**A baby bird on the ground** is often a fledgling learning to fly, with parents nearby. Watch from a distance before stepping in.',
            '**Hurt or orphaned?** Call a licensed wildlife rehabilitator (California Department of Fish and Wildlife keeps a list) rather than caring for the animal at home.',
            'Cats kept indoors or in a catio stay safer, and so do birds: free-roaming cats kill an estimated 1.3–4 billion birds a year in the US.'
          ], src('Sources: Loss, Will &amp; Marra, <i>Nature Communications</i> (2013); California Department of Fish and Wildlife, wildlife rehabilitation facilities.')],
          ['Sharing the land', 'Leave room in the places we shape.', [
            'Native plants, a wild corner, a log left to rot and a shallow dish of water in a heat wave meet a lot of needs at once.',
            '**Nesting season** (roughly February to August in California): check trees and hedges before trimming. Active nests of most wild birds are protected by federal law.',
            'Dark nights help: shielded, warm-colored outdoor lights confuse fewer birds and insects.',
            'Slow down at dusk and dawn, when deer and many others cross roads.'
          ], tryIt('Next time you see a wild animal near home, ask: what is this place offering them?')]
        ],
        note: 'The full Wild animals unit (urban wildlife by species and coexisting on land) is in progress.',
        related: ['#lens-toxins/pesticides/yard', 'Poisons: yard, home and companions']
      },
      children: {
        id: 'children', letter: 'K', name: 'Children', sub: 'Togetherness instead of split labor, and families staying close',
        lede: 'Children share every universal need adults have, and one they show early and often: to contribute. This unit grows from the ideas the whole of Kinship sits on.',
        secs: [
          ['Togetherness, not split labor', 'Kids belong beside the adults.', [
            'We don’t picture one adult doing dishes while the children play somewhere else. Children belong right next to the adults: rinsing, carrying, sorting, sweeping and playing with the real tools that keep a house running.',
            'Work and play happen in the same place, at the same time. Keeping a home and a body alive isn’t a chore split off from life: it is life, and it can be the good part.',
            '**Children want to help.** Taking that away (“go play, I’ll do it”) teaches them their help isn’t wanted. Inviting them in, at whatever level they can manage, builds helpfulness that grows on its own.'
          ]],
          ['No pay, no score, no shame', 'People pitch in because they belong.', [
            'Nobody is paid, bribed, scored or shamed into helping. Kids pitch in because they’re part of the household and it feels good to contribute.',
            '**TEAM:** Togetherness, Encouragement, Autonomy, Minimal interference.',
            '**Requests, not demands,** with kids too: a “not now” is a real answer, and the search goes back to the needs on both sides.',
            '**Protective force isn’t punishment.** Grabbing a hand before the street keeps a child safe; making a child suffer to “learn a lesson” is something else.'
          ], src('Sources: Michaeleen Doucleff, <i>Hunt, Gather, Parent</i> (2021), including her TEAM summary; Barbara Rogoff’s research on children learning by observing and pitching in; Marshall B. Rosenberg, <i>Nonviolent Communication</i>.')],
          ['Families staying close', 'Closeness is a need, and poverty puts it at risk.', [
            '**Closeness is a need.** For babies and children, a steady bond with their own people is how their bodies learn safety. Long or sudden separations can be traumatic, and the stress can shape health for years.',
            '**Poverty often reads as “neglect” on paper.** In the US, neglect is the most common reason children are taken into foster care, and much of it traces to poverty: no stable housing, no childcare, not enough food. Poor families, and Black and Native families most of all, are separated more often.',
            '**Meeting the family’s needs keeps children home.** Studies find that cash support, housing help and childcare lower neglect reports and foster-care entries.',
            '**When a separation can’t be avoided:** kinship care (with grandparents, aunts, uncles or family friends) keeps a child with people they know. Frequent visits and calls, and keeping siblings together, soften the loss.',
            '**Inside systems:** asking for a family room in a shelter, staying beside a child in the hospital, and family-friendly visiting when a parent is incarcerated all keep families close. More than 5 million US children have had a parent in jail or prison.'
          ], src('Sources: Harvard Center on the Developing Child, toxic stress; American Academy of Pediatrics on family separation (2018); US HHS, AFCARS foster care reports; Chapin Hall, economic and concrete supports and child welfare; Annie E. Casey Foundation, <i>A Shared Sentence</i> (2016).') +
            '<p class="rel-q">Related: <a href="' + spHref('distress') + '">People in distress</a> · <a href="' + spHref('power') + '">Power &amp; peace</a> (abolition)</p>'],
          ['Kids across Kinship', 'Where children already show up.', [
            '**Food:** cooking together, with real tools and real jobs.',
            '**Water:** turning over creek stones to count the little creatures, a real field test.',
            '**Poisons:** small bodies take in more per pound, so dust, hands and bottles come first.'
          ], '<p class="rel-q"><a href="#lens-food/cook/together">Food: cooking together</a> · <a href="#lens-water/testing">Water: testing</a> · <a href="#lens-toxins/exposures/dose">Poisons: dose and timing</a></p>' +
            tryIt('Next chore, invite a child in at whatever level they can manage, and let them do it their way.')]
        ],
        note: 'The full Children unit (ages and stages, chores as play, conflict between siblings, keeping families together) is in progress.'
      },
      neighbors: {
      id: 'neighbors', letter: 'N', name: 'Neighbors', sub: 'The people, plants and animals you share a place with',
      lede: 'Neighbors are the ones we mostly don’t choose and can’t avoid sharing with: the same water main, the same air, the same street trees and raccoons. The same four steps (notice, feel, find the need, ask) work here, and sharing a place well is one of the oldest ways people have met their needs.',
      secs: [
        ['What you share', 'Some needs are met together or not at all.', [
        '**Water.** The same main, pipes and watershed. In some places neighbors literally share water rights: a well, a spring, a creek. What one home pours down a drain or onto a lawn reaches everyone downstream.',
        '**Air.** Wildfire smoke, a grill, a gas leaf blower or a busy road reach every window on the block at once. You experience air quality together.',
        '**Walls, sound, light and shade.** Footsteps, music, a porch light, a tall tree: each meets one household’s needs and touches another’s.',
        '**Urban wildlife.** Raccoons, crows, pigeons, coyotes and bees move between yards. What one home offers (scraps, water, shelter) changes the whole block.'
      ], '<p class="rel-q">Water lens: <a href="#lens-water/purify/everyday">sharing clean water with neighbors</a> · <a href="#lens-water/testing/kits">splitting a water test</a></p>'],
        ['Needs you have in common', 'Conflicts live between strategies, never between needs.', [
        'Every neighbor needs rest, safety, clean water and air, belonging, and choice in their own home.',
        'A leaf blower at 8am is one household’s strategy for order; the person next door needs rest. Both needs are real. The search is for a strategy that meets both: a later hour, a rake, a shared schedule.',
        'Start from what you noticed, not what it means: “I heard the blower at 8 this morning,” not “you’re inconsiderate.”'
      ]],
        ['Living harmoniously', 'Old ideas for sharing a place.', [
        '**Commons.** Shared things (a yard, a laundry room, a creek) stay healthy when the people using them make agreements together.',
        '**Agreements, not rules.** Decided together, revisited when they stop working.',
        '**Mutual aid.** Help flows both ways without a ledger: a lent ladder, a shared filter, a meal when someone’s sick.',
        '**Share what you learn.** A water test, an air-quality alert, where the raccoons are getting in. Information is the easiest thing to share.',
        '**Start small.** A wave, a name, a tool lent. Trust builds the way soil does.'
      ], '<p class="rel-remember"><span class="eyebrow">Try it</span>Ask one neighbor: “Do you know if your water’s safe to drink?” Offer to split a test.</p>']
      ],
      note: 'The full Neighbors unit (housemates, buildings, blocks, land and wildlife) is in progress.',
      related: ['#lens-water', 'Water']

      distress: {
        id: 'distress', letter: 'D', name: 'People in distress', sub: 'Meeting someone unhoused or struggling: respect, capacity, boundaries, who can help',
        lede: 'Sometimes a need shows up right in front of us: someone asking for change outside the store, sleeping in a doorway, living in a car down the street, crying on the bus. It’s delicate, and often we can’t meet the whole need, which can feel unbearable. The same four steps help: notice, feel, find the needs (theirs and ours), and choose what we can actually give.',
        secs: [
          ['Seeing someone', 'Acknowledgment is a gift almost anyone can give.', [
            'Looking away, speeding up, pretending not to hear: feigning total disconnect usually feels stranger, on both sides, than a nod, eye contact and “Hi.”',
            'In one study, people felt more connected after a stranger passed with eye contact than after a stranger looked through them “as though air”.',
            '**You don’t owe anyone a smile, money or time.** Basic respect (seeing the person, a kind “not today”, “sorry, I don’t have anything”) is the standard most of us would want for ourselves, and offering it keeps that standard alive in a shared place.',
            'Speak to the person, not about them. Use their name if they offer it. Ask before giving: “Would you like some water?”'
          ], src('Source: Wesselmann, Cardoso, Slater &amp; Williams, “To be looked at as though air: civil attention matters,” <i>Psychological Science</i> (2012).')],
          ['Guilt and capacity', 'Guilt is a signal, not an order.', [
            'Guilt, discomfort or helplessness in these moments often point to needs of your own: **contribution, care, integrity, a fair world.** There’s no need to push them down, and no need to obey them either.',
            'A lot of people are running on empty: stretched money, time, health or grief. **When you’re suffering too, you can’t give generously from nothing**, and that’s capacity, not coldness.',
            '**Anything is better than nothing.** A nod, a bottle of water, a snack, directions to a free meal: small gifts meet real needs, and none of them has to solve everything.',
            'Self-empathy first: “I’m tired and scared about my own rent, and I care about him.” Both are true at once.'
          ]],
          ['Gifts and boundaries', 'Giving in a way that works for you too.', [
            'Help that could last (a ride, a phone, a place to park, regular meals) can bring a scared “now I’m on the hook” feeling. That fear points to needs for choice and sustainability, and boundaries meet them.',
            '**A boundary is about your own actions,** said plainly up front: “I can bring water on Tuesdays. I can’t give rides.” “I can buy you lunch today; I can’t give cash.”',
            'Decide ahead what you can give, so the moment asks less of you: a few care bags in the car (water, socks, snacks, wipes), or a monthly amount for a mutual-aid fund.',
            '**Help in a concentrated place** if one-on-one feels like too much: soup kitchens, community fridges, shower and laundry days, outreach walks. Groups share the load and come with structure.',
            'Trust your body. Distress isn’t danger, and you can still leave any moment that doesn’t feel safe.'
          ]],
          ['Give, then build together', 'Meet the urgent need generously, then share the skills and systems that keep it met.', [
            '**First, give generously.** When a need is urgent (food, water, warmth, a safe night), meeting it comes first, with no tests and no conditions. A hungry person is fed, then everything else.',
            '**Then, stand side by side.** Once the urgent need is met, the next gift is equality: the person as a partner with skills, ideas and needs of their own, not a project. Ask what they want and what they already have.',
            '**Name what’s met and what isn’t.** Most people have many needs met and a few unmet. Saying them out loud (“I have work, a phone and friends; I don’t have a place to sleep”) shows exactly where help goes furthest.',
            '**Skills and systems, not only stuff.** The gifts that last let someone meet a need themselves: a skill, a tool, an introduction, or a shared system like a co-op, a tool library or a rotating fund.',
            '**Together, big needs get small.** A group of people can build a house together for the one person who has everything set except shelter. What no one could give alone becomes a few weekends of many hands, like an old barn raising.',
            'Getting back on one’s feet happens at their pace and by their choice. Help with strings, or help that keeps someone dependent, tends to meet the giver’s needs more than theirs.'
          ], '<p class="rel-q">Related: <a href="' + spHref('projects') + '">Projects</a> (a shared goal, roles by willingness) · <a href="' + spHref('coops') + '">Cooperatives</a></p>' +
            tryIt('Pick one person you’re helping. List the needs that are already met, then the one or two that aren’t. Who else could help with those?')],
          ['Who can meet these needs', 'Learn the local web of help.', [
            '**211** (call or text) knows local shelters, meals, showers, safe parking and benefits.',
            '**988** (call or text) is the crisis line for anyone in emotional distress, including calling on someone else’s behalf. Many California counties also run mobile crisis teams, which don’t send police to a mental-health crisis. For a medical emergency, 911.',
            'Living in a vehicle is how many people keep a roof as rents outpace wages, and it brings its own needs: a safe place to park overnight (many California cities run **safe parking** programs), water, bathrooms, laundry and showers.',
            '**Showers are a real need.** Gym memberships, beaches, truck stops and mobile shower buses (like LavaMaex, started in San Francisco in 2014) are how many people stay clean, and every added shower meets more needs.',
            'Harm-reduction groups, street medicine teams and outreach workers meet people where they are. Asking them what’s most needed (often socks, water, tents, transit passes) beats guessing.'
          ], '<p class="rel-q">Related: <a href="#lens-food/gather/free">Food: free food, and food without a kitchen</a> · <a href="' + spHref('neighbors') + '">Neighbors</a></p>'],
          ['Advocacy', 'The least powerful are the most governed.', [
            'People with the least power are the most shaped by the rules: where it’s legal to sleep, park, sit or wash. Since **City of Grants Pass v. Johnson** (US Supreme Court, 2024), cities can fine or jail people for sleeping outside even when there’s no shelter bed.',
            'Being unhoused is life-threatening: heat, cold, illness and violence all hit harder without walls, and people without homes die much younger on average.',
            'California has more unhoused people than any other state, and most are unsheltered. A 2023 UCSF statewide study found most became homeless in the county they still live in, after losing housing they could no longer afford.',
            '**Housing First** (a home with no preconditions, then support) keeps most people housed in study after study.',
            'Show up where decisions are made: city council meetings, public comment, budget hearings. Bring the needs, not only the complaints: showers, bathrooms, parking, water, homes.'
          ], src('Sources: <i>City of Grants Pass v. Johnson</i> (US Supreme Court, 2024); HUD, <i>Annual Homeless Assessment Report to Congress</i>; UCSF Benioff Homelessness and Housing Initiative, <i>California Statewide Study of People Experiencing Homelessness</i> (2023).') +
            '<p class="rel-q">Next: <a href="' + spHref('power') + '">Power &amp; peace</a> · <a href="' + spHref('coops') + '">Cooperatives</a> (housing co-ops and land trusts) · <a href="#lens-governance">Governance</a></p>' +
            tryIt('Look up what your city offers for showers and safe parking. Who runs it, and what do they need?')]
        ],
        note: 'The full People in distress unit (scripts for hard moments, care bags, and local programs by county) is in progress.',
        related: [spHref('neighbors'), 'Neighbors']
      },
      coops: {
      id: 'coops', letter: 'C', name: 'Cooperatives', sub: 'Workplaces and homes owned and run together',
      lede: 'Most workplaces and most housing are set up so that someone outside the work, or outside the home, owns it and collects the profit. Cooperatives flip that: the people doing the work, or living in the homes, own them together and decide together. It’s one of the oldest ways to share power, and it’s growing.',
      secs: [
        ['Why ownership matters', 'Who owns it decides who it serves.', [
          '**Extracting profit:** in a typical company, value made by workers flows up and out to owners and shareholders. In typical renting, rent flows to a landlord whether or not the home is cared for.',
          '**In a co-op, the people who use it own it.** Members still earn wages or pay housing costs; what’s left over goes back to members or the community instead of outside owners.',
          '**One member, one vote,** not one share, one vote. A dishwasher’s voice counts the same as a founder’s.',
          'The seven cooperative principles: open membership, democratic member control, members share the money, independence, education for members, co-ops helping co-ops, and care for the wider community.'
        ], src('Source: International Cooperative Alliance, <i>Statement on the Cooperative Identity</i> (1995), ica.coop.')],
        ['Worker cooperatives', 'A workplace without a boss above it.', [
          'Workers own the business together, elect or are the board, and decide on pay, hours and direction. Many keep pay ratios small between the highest and lowest paid.',
          'Close to home: the **Arizmendi** bakeries in the Bay Area are worker-owned. **Cooperative Home Care Associates** in the Bronx (since 1985) is one of the largest worker co-ops in the US. **Mondragon** in the Basque Country employs tens of thousands of worker-owners.',
          '**Conversions:** when owners retire, a business can be sold to the people who already run it, keeping jobs local.',
          'California has a **Worker Cooperative Act** (2015) that makes this legal structure easier to set up.'
        ], src('Sources: US Federation of Worker Cooperatives (usworker.coop); Democracy at Work Institute; California AB 816 (2015).')],
        ['Living together: housing and land', 'Homes that can’t be flipped for profit.', [
          '**Housing cooperative:** residents own the building together through a co-op. Each household holds a share and the right to live in their home, and members decide on rules, repairs and costs.',
          '**Limited-equity co-op:** the share price is capped, so the home stays affordable for the next household instead of rising with the market.',
          '**Community land trust (CLT):** a nonprofit holds the land forever, for the community. Households own or rent the home on top under a long lease, and agree to a fair resale price. The first one in the US, New Communities in Georgia (1969), was started by Black farmers in the civil rights movement.',
          '**Cohousing:** private homes clustered around a shared common house, kitchen and garden, with decisions made together. It began in Denmark.',
          '**Student and group houses:** the Berkeley Student Cooperative has housed students together since 1933. Many land co-ops and farm co-ops work the same way: people hold land together instead of one owner holding it over others.'
        ], src('Sources: National Association of Housing Cooperatives; Grounded Solutions Network (groundedsolutions.org) on CLTs; Cohousing Association of the US; Berkeley Student Cooperative.')],
        ['Starting small', 'Practice sharing before owning.', [
          'A buying club, a tool library, a shared garden or a babysitting swap: each is a tiny co-op with agreements and shared decisions.',
          'Tenants who talk to each other can start as a tenant association, and some buildings later buy together.',
          'Deciding together: **consensus** (everyone agrees), **consent** (no one has a strong objection, as in sociocracy), or **majority vote**. Each fits different groups and decisions.',
          'California help: the **Sustainable Economies Law Center** in Oakland offers free legal resources for co-ops and shared housing.'
        ], tryIt('Name one thing you already share with others: a laundry room, a car, a garden. What agreement would make it work better for everyone?')]
      ],
      note: 'The full Cooperatives unit (meetings, money, conversions, and how to start a housing co-op or CLT) is in progress.',
      related: [spHref('power'), 'Power & peace']
    },
      plants: {

        lede: 'A yellow leaf or a bare patch of soil is a message about a need: water, light, nutrients, shelter. The same four steps work with plants: notice, wonder what they’re feeling, find the need, and change what you offer.',

      projects: {

      power: {
      id: 'power', letter: 'P', name: 'Power & peace', sub: 'Nonviolence, abolition, and power shared instead of held over',
      lede: 'The same four steps that work between two people work in families, workplaces, towns and whole systems. Underneath every system of punishment is an idea about who is good, who is bad, and who deserves to suffer. Nonviolence asks a different question: what does everyone here need, and how do we meet it together?',
      secs: [
        ['Power over, power with', 'Two ways to get things done together.', [
          '**Power over:** one side decides for the other and backs it up with fear, punishment, shame or reward.',
          '**Power with:** decisions made together, where everyone’s needs count, including the people with the least say right now.',
          'Power over can get compliance fast. It costs trust, and people tend to comply only while someone is watching. Power with is slower to start and lasts longer.',
