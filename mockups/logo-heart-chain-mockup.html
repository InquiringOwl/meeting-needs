<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinship · Logo mock-ups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500..800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#EEF2E8; --ink:#17241C; --muted:#3F5546; --pink:#C2477F; --paper:#FCEFF4; --line:rgba(23,36,28,.16); }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--ink); font:16px/1.5 'Instrument Sans',system-ui,sans-serif; padding:24px 16px 64px; }
main { max-width:980px; margin:0 auto; }
h1 { font:800 28px/1.15 Manrope,sans-serif; letter-spacing:-.02em; }
.lede { color:var(--muted); margin:6px 0 24px; max-width:60ch; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr)); gap:18px; }
.card { background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8); border-radius:22px; padding:18px; box-shadow:0 12px 40px rgba(30,60,30,.08); }
.card.now { opacity:.85; }
.tag { font:500 11px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--pink); }
.card h2 { font:800 20px Manrope,sans-serif; letter-spacing:-.02em; margin:2px 0 4px; }
.card p { color:var(--muted); font-size:15px; }
.big { background:#FFFDF9; border-radius:16px; margin:14px 0; padding:22px 16px; display:flex; justify-content:center; }
.big svg { width:100%; max-width:330px; height:auto; }
.label { font:500 11px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px; }
.hdr { display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,.64); border:1px solid rgba(255,255,255,.8); border-radius:16px; padding:8px 14px; max-width:360px; }
.brand { display:flex; align-items:center; gap:10px; min-height:44px; text-decoration:none; color:var(--ink); }
.brand b { font:800 20px Manrope,sans-serif; letter-spacing:-.02em; }
.hdr nav a { font-size:14.5px; color:var(--ink); text-decoration:none; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.62); }
.fav { display:flex; align-items:center; gap:14px; }
.fav span { display:flex; align-items:center; gap:6px; background:#fff; border-radius:8px; padding:5px 10px 5px 6px; font-size:13px; color:var(--muted); border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Kinship logo mock-ups</h1>
  <p class="lede">Same pink (#C2477F) and paper (#FCEFF4). Hearts now hang level and upright, like a garland on a wall, with vintage details: a folded centre crease, lace edges or a sewn thread. Each one is shown large, at real header size (phone width) and as a favicon.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
var P = '#C2477F', W = '#FCEFF4';
var H = 'M12 21.2C7.4 18 3.3 14.6 2.4 10.9 1.6 7.5 3.8 4.6 6.9 4.6c2.1 0 3.6 1.2 5.1 3.1 1.5-1.9 3-3.1 5.1-3.1 3.1 0 5.3 2.9 4.5 6.3C20.7 14.6 16.6 18 12 21.2z';
function tf(cx, ty, s) { return 'translate(' + (cx - 12 * s) + ' ' + ty + ') scale(' + s + ')'; }
/* One cut-paper heart: pink rim behind, paper on top. */
function paper(cx, ty, s, rim) {
  var t = tf(cx, ty, s);
  return '<path d="' + H + '" transform="' + t + '" fill="' + P + '" stroke="' + P + '" stroke-width="' + (rim || 3.2) + '" stroke-linejoin="round"/>' +
         '<path d="' + H + '" transform="' + t + '" fill="' + W + '"/>';
}
function lace(cx, ty, s) {
  var t = tf(cx, ty, s);
  return '<path d="' + H + '" transform="' + t + '" fill="none" stroke="' + P + '" stroke-width="4.4" stroke-dasharray="0 2.75" stroke-linecap="round"/>' + paper(cx, ty, s, 2.2);
}
function crease(cx, y1, y2) {
  return '<path d="M' + cx + ' ' + y1 + 'V' + y2 + '" stroke="' + P + '" stroke-width=".75" stroke-dasharray=".9 1.4" stroke-linecap="round" opacity=".7"/>';
}
function svg(vb, w, h, inner) {
  return '<svg viewBox="' + vb + '" width="' + w + '" height="' + h + '" aria-hidden="true" fill="none">' + inner + '</svg>';
}

var OPTIONS = [
  { tag: 'Today', name: 'Current chain', now: true,
    note: 'For comparison: three tilted hearts, offset in height.',
    vb: [0, 0, 60, 24], logo: function () {
      var hearts = ['rotate(-5 12 13)', 'translate(17 0.6)', 'translate(34 0) rotate(5 12 13)'].map(function (t) { return '<path d="' + H + '" transform="' + t + '"/>'; }).join('');
      return '<g transform="translate(0 -1.4)"><g fill="' + P + '" stroke="' + P + '" stroke-width="3.2" stroke-linejoin="round">' + hearts + '</g><g fill="' + W + '">' + hearts + '</g>' +
        '<g stroke="' + P + '" stroke-width="1" stroke-dasharray="1.4 1.6" stroke-linecap="round" opacity=".7"><path d="M20.6 7.6v6.2"/><path d="M37.6 7.8v6.2"/></g></g>';
    },
    fav: function () { return paper(12, 0, 1, 2.2); } },

  { tag: 'Option A', name: 'Garland',
    note: 'Three folded paper hearts hung on short strings from a gently sagging thread. The dotted crease is where each heart was folded to cut it.',
    vb: [0, 0, 60, 27], logo: function () {
      var out = '<path d="M1 3.2Q30 7.4 59 3.2" stroke="' + P + '" stroke-width=".9" stroke-linecap="round"/>' +
        '<circle cx="1.2" cy="3.2" r="1.1" fill="' + P + '"/><circle cx="58.8" cy="3.2" r="1.1" fill="' + P + '"/>';
      [[10, 4.3], [30, 5.3], [50, 4.3]].forEach(function (c) {
        out += '<path d="M' + c[0] + ' ' + c[1] + 'V14.6" stroke="' + P + '" stroke-width=".8"/>' + paper(c[0], 9.5, 0.72) + crease(c[0], 15.6, 23.4);
      });
      return out;
    },
    fav: function () { return paper(12, 0, 1, 2.4) + crease(12, 8.6, 19.4); } },

  { tag: 'Option B', name: 'Hung paper chain',
    note: 'Closest to today: one strip of paper cut into joined hearts, but level and upright, hung from a nail. Each heart has a sewn running stitch, like an old valentine.',
    vb: [0, 0, 50, 25], logo: function () {
      var out = '<path d="M4.8 8.6L25 1.6 45.2 8.6" stroke="' + P + '" stroke-width=".8" stroke-linejoin="round"/>';
      [9, 25, 41].forEach(function (cx) { out += paper(cx, 5, 0.82); });
      [9, 25, 41].forEach(function (cx) {
        out += '<path d="' + H + '" transform="translate(' + cx + ' 15.6) scale(.58) translate(-12 -12.9)" stroke="' + P + '" stroke-width="1.1" stroke-dasharray="1.5 1.5" opacity=".75"/>';
      });
      out += '<circle cx="25" cy="1.6" r="1.25" fill="' + P + '"/>';
      return out;
    },
    fav: function () { return paper(12, 0, 1, 2.4) + '<path d="' + H + '" transform="translate(12 12.9) scale(.62) translate(-12 -12.9)" stroke="' + P + '" stroke-width="1.5" stroke-dasharray="2 1.8" opacity=".8"/>'; } },

  { tag: 'Option C', name: 'Lace garland',
    note: 'The garland from A with doily-scalloped edges, like a paper-lace valentine from a 1940s card.',
    vb: [0, 0, 60, 28], logo: function () {
      var out = '<path d="M1 3.2Q30 7.4 59 3.2" stroke="' + P + '" stroke-width=".9" stroke-linecap="round"/>' +
        '<circle cx="1.2" cy="3.2" r="1.1" fill="' + P + '"/><circle cx="58.8" cy="3.2" r="1.1" fill="' + P + '"/>';
      [[10, 4.3], [30, 5.3], [50, 4.3]].forEach(function (c) {
        out += '<path d="M' + c[0] + ' ' + c[1] + 'V15" stroke="' + P + '" stroke-width=".8"/>' + lace(c[0], 10, 0.7);
      });
      return out;
    },
    fav: function () { return '<g transform="translate(12 12.9) scale(.9) translate(-12 -12.9)">' + lace(12, 0, 1) + '</g>'; } },

  { tag: 'Option D', name: 'Threaded hearts',
    note: 'Hearts strung on one thread that runs through them in a running stitch, loose between them and knotted at each end.',
    vb: [0, 0, 60, 24], logo: function () {
      var out = '<path d="M1 9.6Q2 12.6 10 12.6Q20 15.4 30 12.6Q40 15.4 50 12.6Q58 12.6 59 9.6" stroke="' + P + '" stroke-width=".9" stroke-linecap="round"/>' +
        '<circle cx="1" cy="9.4" r="1.1" fill="' + P + '"/><circle cx="59" cy="9.4" r="1.1" fill="' + P + '"/>';
      [10, 30, 50].forEach(function (cx) {
        out += paper(cx, 4.4, 0.72) + '<path d="M' + (cx - 5.4) + ' 12.6H' + (cx + 5.4) + '" stroke="' + P + '" stroke-width=".95" stroke-dasharray="1.6 1.3" stroke-linecap="round"/>';
      });
      return out;
    },
    fav: function () { return paper(12, 0, 1, 2.4) + '<path d="M4.6 11.6H19.4" stroke="' + P + '" stroke-width="1.5" stroke-dasharray="2.2 1.8" stroke-linecap="round"/>'; } }
];

var html = '';
OPTIONS.forEach(function (o) {
  var vb = o.vb.join(' '), inner = o.logo();
  var hw = Math.round(o.vb[2] * 1.03), hh = Math.round(o.vb[3] * 1.03);
  var fav = o.fav();
  html += '<section class="card' + (o.now ? ' now' : '') + '"><div class="tag">' + o.tag + '</div><h2>' + o.name + '</h2><p>' + o.note + '</p>' +
    '<div class="big">' + svg(vb, o.vb[2] * 5, o.vb[3] * 5, inner) + '</div>' +
    '<div class="label">Header, real size</div>' +
    '<div class="hdr"><a class="brand" href="#">' + svg(vb, hw, hh, inner) + '<b>Kinship</b></a><nav><a href="#">About</a></nav></div>' +
    '<div class="label">Favicon</div><div class="fav">' +
    '<span>' + svg('-1 -1 26 26', 16, 16, fav) + 'Kinship</span>' +
    '<span>' + svg('-1 -1 26 26', 32, 32, fav) + '32 px</span></div></section>';
});
document.getElementById('grid').innerHTML = html;
</script>
</body>
</html>
